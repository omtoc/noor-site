<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noor — Legal</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #111113; --muted: #5d5d63; --card: #f3f3f5; --line: #e2e2e6; --link: #0b57d0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #ffffff; --muted: #a3a3a8; --card: #171719; --line: #2c2c2f; --link: #8ab4f8; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    header p { color: var(--muted); margin: 4px 0 0; }
    h1 { font-size: 28px; line-height: 1.25; margin: 0; }
    h2 { font-size: 19px; line-height: 1.35; margin: 32px 0 8px; }
    p, li { color: var(--fg); }
    ul { padding-inline-start: 22px; margin: 8px 0; }
    li { margin: 6px 0; }
    a { color: var(--link); word-break: break-word; }
    .summary { background: var(--card); border-radius: 16px; padding: 4px 20px 12px; margin-top: 24px; }
    .summary h2 { margin-top: 16px; }
    nav { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Noor</h1>
      <p>Quran, prayer times and Qibla.</p>
    </header>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms of Use</a></li>
    </ul>
    <nav>Contact: <a href="mailto:pistonae1@gmail.com">pistonae1@gmail.com</a></nav>
  </main>
</body>
</html>
